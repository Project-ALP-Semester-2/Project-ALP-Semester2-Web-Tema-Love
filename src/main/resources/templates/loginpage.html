<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnSaid — Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../static/css/index.css" />
</head>
<body class="d-flex flex-column min-vh-100 overflow-x-hidden">

  <main class="container-fluid flex-grow-1 d-flex p-0">
    <div class="row g-0 m-0 w-100">
      <div class="col-12 col-lg-6 d-none d-lg-flex align-items-center justify-content-center panel-left position-relative p-5">
        <img
          src="../static/images/Ilustrasi_hati.png"
          alt="UnSaid — paper-cut heart illustration"
          class="img-fluid"
          style="width: 100%; max-width: 700px; height: auto; mix-blend-mode: multiply; object-fit: contain;"
          onerror="this.style.display='none';"
        />
      </div>

      <div class="col-12 col-lg-6 d-flex flex-column justify-content-center align-items-center align-items-lg-start px-4 px-md-5 py-4 bg-white">
        
        <div class="d-flex align-items-center gap-2 mb-4">
          <div class="rounded-3 overflow-hidden" style="width: 44px; height: 44px;">
            <img  
              src="../static/images/Logo_icon.png"
              alt="UnSaid icon"
              class="w-100 h-100 object-fit-cover"
            />
          </div>
          <div>
            <img
              src="../static/images/Logo_wordmark.png"
              alt="UnSaid"
              style="height: 28px; object-fit: contain;"
            />
          </div>
        </div>

        <h1 class="tagline text-center text-lg-start mb-4">
          Apa yang tak<br>
          terucap, kini<br>
          <em class="tagline-em">didengar.</em>
        </h1>

        <div class="d-flex flex-column gap-3 w-100" style="max-width: 440px;">
          
          <button class="btn btn-primary rounded-pill py-3 fw-medium" onclick="handleAnonymous()">
            Bergabung Secara Anonim
          </button>

          <div class="d-flex align-items-center my-2">
            <hr class="flex-grow-1 text-muted">
            <span class="mx-3 text-muted text-uppercase" style="font-size: 12px; font-weight: 500;">atau</span>
            <hr class="flex-grow-1 text-muted">
          </div>

          <button class="btn btn-social rounded-pill py-3 fw-medium d-flex align-items-center justify-content-center gap-2" onclick="handleGoogle()">
            <i class="bi bi-google fs-5 text-dark"></i> Lanjutkan dengan Google
          </button>

          <button class="btn btn-social rounded-pill py-3 fw-medium d-flex align-items-center justify-content-center gap-2" onclick="handleApple()">
            <i class="bi bi-apple fs-4 text-dark"></i> Lanjutkan dengan Apple
          </button>

          <div class="mt-4 text-center">
            <p class="text-muted mb-2" style="font-size: 13px;">Already have an account?</p>
            
            <a th:href="@{/signin}" class="btn btn-social rounded-pill py-3 w-100 fw-medium text-decoration-none text-center">
              Sign in
            </a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="d-flex flex-wrap align-items-center justify-content-between py-3 px-4 px-md-5" style="background: #FDE9EC;">
    <span class="text-muted" style="font-size: 12px;">© 2026 UnSaid. Safe Space for Stories.</span>
    <nav class="d-flex gap-3 flex-wrap mt-2 mt-md-0">
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">About</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Community Guidelines</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Privacy Policy</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Terms of Service</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Help Center</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Cookies</a>
    </nav>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="../static/js/loginpage.js"></script>
</body>
</html>
