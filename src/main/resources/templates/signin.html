<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnSaid — Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/index.css" />
</head>
<body class="d-flex flex-column min-vh-100 overflow-x-hidden">

  <main class="container-fluid flex-grow-1 d-flex p-0">
    <div class="row g-0 m-0 w-100">
      
      <div class="col-12 col-lg-6 d-none d-lg-flex align-items-center justify-content-center panel-left position-relative p-5">
        <img
          src="../images/Ilustrasi_hati.png"
          alt="UnSaid — paper-cut heart illustration"
          class="img-fluid"
          style="width: 100%; max-width: 700px; height: auto; mix-blend-mode: multiply; object-fit: contain;"
          onerror="this.style.display='none';"
        />
      </div>

      <div class="col-12 col-lg-6 d-flex flex-column justify-content-center align-items-center align-items-lg-start px-4 px-md-5 py-4 bg-white">
        
        <div class="d-flex align-items-center gap-2 mb-4">
          <div class="rounded-3 overflow-hidden" style="width: 44px; height: 44px;">
            <img  
              src="../images/Logo_icon.png"
              alt="UnSaid icon"
              class="w-100 h-100 object-fit-cover"
            />
          </div>
          <div>
            <img
              src="../images/Logo_wordmark.png"
              alt="UnSaid"
              style="height: 28px; object-fit: contain;"
            />
          </div>
        </div>

        <h1 class="tagline text-center text-lg-start mb-2">
          Selamat <em class="tagline-em">Datang.</em>
        </h1>
        <p class="text-muted mb-4 text-center text-lg-start" style="font-size: 15px;">Silakan masuk menggunakan akun resmi Anda.</p>

        <div class="w-100" style="max-width: 440px;">
          
          <div th:if="${pesanError}" class="alert alert-danger rounded-4 p-3 mb-3" role="alert" style="font-size: 14px;">
            <i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${pesanError}">Username atau password salah!</span>
          </div>

          <form th:action="@{/proses-signin}" method="POST" class="d-flex flex-column gap-3">
            
            <div>
              <label for="username" class="form-label fw-medium text-secondary mb-2" style="font-size: 14px;">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" id="username" name="username" class="form-control bg-light border-start-0 rounded-end-pill py-3" placeholder="Masukkan username Anda" required autocomplete="username" />
              </div>
            </div>

            <div>
              <label for="password" class="form-label fw-medium text-secondary mb-2" style="font-size: 14px;">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password" class="form-control bg-light border-start-0 rounded-end-pill py-3" placeholder="Masukkan password Anda" required autocomplete="current-password" />
              </div>
            </div>

            <button type="submit" class="btn btn-primary rounded-pill py-3 fw-medium mt-2 w-100">
              Masuk ke Akun
            </button>
          </form>

          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1 text-muted">
            <span class="mx-3 text-muted" style="font-size: 12px; font-weight: 500;">ATAU</span>
            <hr class="flex-grow-1 text-muted">
          </div>

          <div class="text-center">
            <p class="text-muted mb-3" style="font-size: 13px;">Belum memiliki akun resmi UnSaid?</p>
            
            <a th:href="@{/signup}" class="btn btn-social rounded-pill py-3 w-100 fw-medium text-decoration-none text-center mb-2">
              Buat Akun Baru (Sign Up)
            </a>

            <a th:href="@{/login}" class="text-decoration-none fw-medium d-inline-block mt-2" style="font-size: 13px; color: #727272;">
              <i class="bi bi-arrow-left me-1"></i> Kembali ke pilihan login
            </a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="d-flex flex-wrap align-items-center justify-content-between py-3 px-4 px-md-5" style="background: #FDE9EC;">
    <span class="text-muted" style="font-size: 12px;">© 2026 UnSaid. Safe Space for Stories.</span>
    <nav class="d-flex gap-3 flex-wrap mt-2 mt-md-0">
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">About</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Community Guidelines</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Privacy Policy</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Terms of Service</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Help Center</a>
      <a href="#" class="text-muted text-decoration-none" style="font-size: 12px;">Cookies</a>
    </nav>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
